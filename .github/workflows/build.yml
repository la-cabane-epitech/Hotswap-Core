name: Build & tests

on:
  push:
  pull_request:

jobs:
  build:
    # The team develops on both: a macOS-only regression must not wait for the
    # one developer on macOS to stumble on it, and the same goes for Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build project
        run: ./build.sh

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
